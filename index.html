<style>
:root{--card:rgba(255,255,255,.9);--ink:#5b3b8c;--soft:rgba(91,59,140,.12);--btn:#ff8fcf;--btn2:#b69cff;--ok:#2f9e6b;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#e56bb8;--btn2:#8a6cf0;--ok:#6ee7a8;--warn:#fdba74}}
:root[data-theme="dark"]{--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#e56bb8;--btn2:#8a6cf0;--ok:#6ee7a8;--warn:#fdba74}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#cdb8ff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
#box{background:var(--card);border-radius:28px;padding:18px 22px;max-width:420px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(120,60,180,.35);backdrop-filter:blur(6px)}
#box img.logo{width:min(200px,50vw);height:auto}
h1{margin:4px 0;font-size:1.6rem;line-height:1.15}h2{margin:10px 0 4px;font-size:1.05rem}
p{margin:6px 0;font-size:1rem;line-height:1.4}.meta{font-size:.82rem;opacity:.8}.big{font-size:1.25rem}.warn{color:var(--warn)}.okc{color:var(--ok)}
ol{text-align:left;margin:8px 0;padding-left:1.3em;font-size:.95rem;line-height:1.45}li{margin:4px 0}
input[type=text],input[type=tel]{font:inherit;font-size:1.05rem;padding:8px 14px;border-radius:999px;border:2px solid var(--btn2);width:80%;max-width:260px;text-align:center;color:var(--ink);background:transparent;margin:4px 0;box-sizing:border-box}
button{margin-top:10px;font:inherit;font-weight:700;font-size:1.15rem;color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;background:linear-gradient(90deg,var(--btn),var(--btn2));box-shadow:0 4px 14px rgba(150,80,200,.4)}
button:active{transform:scale(.96)}button:disabled{opacity:.55;cursor:default}
button.sec{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--btn2);font-size:1rem;padding:9px 18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.row button{margin-top:8px}
.chips{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.chip{flex:1;margin:0;padding:8px 4px;font-size:.95rem;border-radius:18px;background:transparent;color:var(--ink);border:2px solid var(--btn2);box-shadow:none;line-height:1.2}
.chip small{display:block;font-weight:400;font-size:.68rem;opacity:.8;margin:2px 0 0}
.chip.on{background:linear-gradient(90deg,var(--btn),var(--btn2));color:#fff;border-color:transparent}
.tabs{display:flex;gap:6px;justify-content:center}.tabs .chip{flex:0 1 120px}
table.lb{width:100%;border-collapse:collapse;margin:8px 0;font-size:1rem}
table.lb td{padding:5px 6px;border-bottom:1px solid var(--soft);text-align:left}table.lb td:last-child{text-align:right;font-weight:700}table.lb td:first-child{width:2.4em;text-align:center}
table.lb tr.me td{background:var(--soft)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:7px 0;border-bottom:1px solid var(--soft);font-size:.95rem}
.set input[type=range]{width:46%}.set input[type=checkbox]{width:22px;height:22px;accent-color:#b69cff}
.set .chips{margin:0;flex:1}.set .chip{padding:5px 2px;font-size:.82rem}
.ticket{border:2px dashed var(--btn2);border-radius:18px;padding:10px;margin:10px 0}
.ticket .code{font-size:1.7rem;font-weight:800;letter-spacing:.08em;font-family:ui-monospace,Menlo,Consolas,monospace}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.badge{border:2px solid var(--soft);border-radius:14px;padding:6px 8px;font-size:.82rem}.badge.on{border-color:var(--btn2);background:var(--soft)}.badge b{display:block;font-size:.9rem}
.stat{display:flex;justify-content:space-around;margin:8px 0}.stat div{font-size:.78rem;opacity:.85}.stat b{display:block;font-size:1.2rem;opacity:1}
small.foot{display:block;margin-top:12px;opacity:.7;font-size:.72rem}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

'use strict';
/* ===== RULES v1 — identical in index.html and Code.gs. Do not edit one without the other. ===== */
var RULES_VERSION = 1;
var POINTS = { f: 1, s: 2, p: 2, b: 3, c: 3, t: 4, m: 4 };           // fries, salad, pizza, burger, chicken, tea, matcha
var GOODS = ['f', 'f', 's', 'p', 'p', 'b', 'c', 't', 'm'];
var START_LIVES = 3, MAX_LIVES = 5, LOGO_PTS = 25, DBL_MS = 10000, MAGNET_MS = 8000, SLOW_MS = 5000, MAX_MULT = 8;
var MIN_FALL = 0.25, MAX_FALL = 45;                                   // seconds an item may take from spawn to catch/miss
var MODES = { classic: { dur: 0, ranked: 1 }, rush: { dur: 60, ranked: 1 }, chill: { dur: 0, ranked: 0 } };

function mulberry32(a) {
  return function () {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function levelAt(sec) { return 1 + Math.floor(sec / 15); }
function pBad(lv) { return Math.min(0.45, 0.18 + lv * 0.03); }
function gapFor(lv) { return Math.max(0.28, 0.95 - lv * 0.06); }

// Every item that will ever spawn is decided by the server-issued seed.
// k: good-item letter | 'x' ghost/pumpkin | 'L' Rainbrew logo | 'G' magnet | 'H' shield | 'W' slow-mo | 'D' double points | 'U' extra life
function makeSchedule(seed) {
  var r = mulberry32(seed >>> 0), i = 0, T = 0.8;
  return {
    next: function () {
      var lv = levelAt(T);
      var r1 = r(), r2 = r(), r3 = r(), r4 = r(), r5 = r(), r6 = r(), r7 = r();
      var k;
      if (r1 < pBad(lv)) k = 'x';
      else if (r3 < 0.07) k = 'L';
      else if (r3 < 0.14) k = r2 < 0.25 ? 'G' : r2 < 0.5 ? 'H' : r2 < 0.7 ? 'W' : r2 < 0.92 ? 'D' : 'U';
      else k = GOODS[Math.floor(r2 * GOODS.length)];
      var it = { i: i, T: T, k: k, lv: lv, ghost: r2 < 0.5, fx: r4, v: (90 + Math.min(lv, 14) * 18) * (0.8 + r5 * 0.5), w: r6 * 6 };
      i++; T += gapFor(lv) * (0.85 + r7 * 0.3);
      return it;
    }
  };
}

function newState() { return { score: 0, combo: 0, maxCombo: 0, catches: 0, lives: START_LIVES, shield: 0, dbl: -1, over: 0 }; }

// t = integer game-time milliseconds, a = 'c' caught | 'x' hit a baddie | 'm' missed a treat, k = item kind
function applyEvent(S, t, a, k) {
  var d = S.dbl >= t ? 2 : 1;
  if (a === 'm') { S.combo = 0; return; }
  if (a === 'x') {
    if (S.shield) { S.shield = 0; } else { S.lives--; S.combo = 0; if (S.lives <= 0) S.over = 1; }
    return;
  }
  if (k === 'L') { S.score += LOGO_PTS * d; return; }
  if (k === 'G' || k === 'W') return;                                 // movement/visual effects only
  if (k === 'H') { S.shield = 1; return; }
  if (k === 'D') { S.dbl = t + DBL_MS; return; }
  if (k === 'U') { S.lives = Math.min(MAX_LIVES, S.lives + 1); return; }
  S.combo++; if (S.combo > S.maxCombo) S.maxCombo = S.combo; S.catches++;
  S.score += POINTS[k] * Math.min(MAX_MULT, 1 + Math.floor(S.combo / 5)) * d;
}
/* ===== END RULES ===== */

    ch.forEach((c, i) => { const yy = y + S * (1.35 + i * .42); ctx.strokeText(c, W - 14, yy); ctx.fillText(c, W - 14, yy); });
    if (st === 'play') { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(W - S * .6, S * 1.15 + S * .2, S * .3, 0, 7); ctx.fill(); ctx.fillStyle = '#7b4bb8'; ctx.fillRect(W - S * .6 - S * .12, S * 1.35 - S * .13, S * .09, S * .26); ctx.fillRect(W - S * .6 + S * .03, S * 1.35 - S * .13, S * .09, S * .26); }
    ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#7b4bb8'; ctx.strokeText('Rainbrew Coffee Shop', W / 2, H - 10); ctx.fillText('Rainbrew Coffee Shop', W / 2, H - 10);
  }
  if (flashT > 0) { ctx.globalAlpha = Math.min(1, flashT * 2); ctx.textAlign = 'center'; ctx.font = 'bold ' + S * .5 + 'px sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#7b4bb8'; ctx.strokeText(flash, W / 2, H * .3); ctx.fillText(flash, W / 2, H * .3); ctx.globalAlpha = 1; }
  if (st === 'count') { ctx.textAlign = 'center'; ctx.font = 'bold ' + S * 2 + 'px sans-serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff6fb5'; const s = cd > 0 ? String(Math.ceil(cd)) : 'Go!'; ctx.strokeText(s, W / 2, H * .42); ctx.fillText(s, W / 2, H * .42); if (cd <= 0 && !sessDone) { ctx.font = 'bold ' + S * .4 + 'px sans-serif'; ctx.lineWidth = 5; ctx.strokeText('Connecting…', W / 2, H * .55); ctx.fillText('Connecting…', W / 2, H * .55); } }
  if (cfg.fps) { ctx.textAlign = 'left'; ctx.font = '12px monospace'; ctx.fillStyle = '#000'; ctx.fillText(Math.round(fpsA) + ' fps', 8, H - 24); }
}

/* ============ network (never blocks the game loop) ============ */
async function api(method, params, body, ms) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 10000);
  try {
    const url = CONFIG.API_URL + (method === 'GET' ? '?' + new URLSearchParams(params).toString() : '');
    const r = await fetch(url, method === 'GET' ? { signal: ctl.signal, redirect: 'follow' } : { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(to); }
}
async function retry(fn, tries) {
  let lastR = { ok: false, err: 'net' };
  for (let i = 0; i < tries; i++) {
    try { const r = await fn(); if (r && (r.ok || ['slow', 'busy', 'server'].indexOf(r.err) < 0)) return r; lastR = r || lastR; } catch (e) { lastR = { ok: false, err: 'net' }; }
    if (i < tries - 1) await sleep(Math.min(6000, 600 * Math.pow(2, i)) + Math.random() * 400);   // exponential back-off with jitter spreads out crowds
  }
  return lastR;
}
async function fetchBoard(m, force) {
  const key = 'rb_lbc_' + m, c = LS.get(key, null);
  if (!force && c && Date.now() - c.got < 20000) return c;
  try { const r = await retry(() => api('GET', { action: 'lb', mode: m }), 2); if (r && r.ok) { r.got = Date.now(); LS.set(key, r); return r; } } catch (e) {}
  return c ? Object.assign({}, c, { stale: 1 }) : null;
}
let flushing = false;
async function flushPending() {
  const q = LS.get('rb_pending', []); if (flushing || !q.length || !CONFIG.API_URL) return; flushing = true;
  try {
    const keep = [];
    for (const p of q) { const r = await retry(() => api('POST', null, p), 1); if (r.ok) saveTicket(r, p); else if (['net', 'busy', 'server', 'rate'].indexOf(r.err) >= 0) keep.push(p); }
    LS.set('rb_pending', keep);
  } finally { flushing = false; }
}
function saveTicket(r, p) {
  myPid = r.pid; LS.set('rb_pid', myPid);
  tickets.unshift({ code: r.code, score: r.score, mode: p.mode || mode, season: r.season, at: Date.now() }); tickets = tickets.slice(0, 10); LS.set('rb_tickets', tickets);
  LS.set('rb_recent', { mode: p.mode || mode, score: r.score, at: Date.now() }); LS.set('rb_lbc_' + (p.mode || mode), null);
}

/* ============ screens ============ */
const FOOT = '<small class="foot">© 2026 Rainbrew Coffee Shop. The Rainbrew name, logo &amp; products are owned by Rainbrew Coffee Shop. Game code is open source (MIT).</small>';
const MODE_NAME = { classic: 'Classic', rush: 'Rush', chill: 'Chill' };
function screen(h) { clearInterval(lbTimer); box.innerHTML = h + FOOT; ov.style.display = 'flex'; box.scrollTop = 0; }
function chip(m, a, b) { return `<button class="chip${mode === m ? ' on' : ''}" data-a="mode:${m}" role="radio" aria-checked="${mode === m}">${a}<small>${b}</small></button>`; }

function toggle(k, label) { return `<label class="set"><span>${label}</span><input type="checkbox" data-k="${k}" ${cfg[k] ? 'checked' : ''}></label>`; }

function opts(k, label, list) { return `<div class="set"><span>${label}</span><div class="chips">${list.map(([v, n]) => `<button class="chip${cfg[k] === v ? ' on' : ''}" data-a="cfg:${k}:${v}">${n}</button>`).join('')}</div></div>`; }
function settings() {
  screen(`<h1>⚙️ Settings</h1>
  ${toggle('mute', '🔇 Mute everything')}${slider('sfx', '🔊 Sound effects', 0, 1, .05)}${slider('music', '🎵 Music', 0, 1, .05)}

  <h2>Player</h2><p class="meta">Your name appears on the leaderboard. Your mobile number is private and only used by staff to confirm prizes.</p>

}
function profile() {
  const n = Object.keys(ach).length, total = Object.keys(ACH).length;
  screen(`<h1>🎖 Profile</h1>
  <div class="stat"><div><b>${stats.games}</b>games</div><div><b>${stats.catches}</b>treats caught</div><div><b>${n}/${total}</b>badges</div></div>
  <div class="stat"><div><b>${stats.best.classic}</b>Classic best</div><div><b>${stats.best.rush}</b>Rush best</div><div><b>${stats.best.chill}</b>Chill best</div></div>
  <div class="badges">${Object.keys(ACH).map(k => `<div class="badge${ach[k] ? ' on' : ''}"><b>${ach[k] ? '🎖' : '🔒'} ${ACH[k][0]}</b>${ACH[k][1]}</div>`).join('')}</div>
  ${tickets.length ? `<h2>My verification codes</h2><table class="lb">${tickets.map(x => `<tr><td></td><td>${esc(x.code)}<br><span class="meta">${MODE_NAME[x.mode] || ''} · ${new Date(x.at).toLocaleDateString()}</span></td><td>${x.score}</td></tr>`).join('')}</table>` : ''}
  <button data-a="menu">← Back</button>`);
}
function pauseScreen() {
  st = 'pause'; musicStop();
  screen(`<h1>Paused ⏸</h1><p class="meta">Score ${S0.score} · Level ${lv}</p><button data-a="resume">Resume ▶</button>
  <div class="row"><button class="sec" data-a="set">⚙️ Settings</button><button class="sec" data-a="endrun">${mode === 'chill' ? 'Finish' : 'End run'}</button></div>
  <button class="sec" data-a="quit">Quit to menu</button><p class="meta">“End run” submits your score so far. “Quit” discards it.</p>`);
}
function ago(ms) { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; }
function localBoard(m) { return LS.get('rb_local_' + m, []); }
function tabs() { return `<div class="tabs" role="tablist">${['classic', 'rush'].map(m => `<button class="chip${lbTab === m ? ' on' : ''}" data-a="tab:${m}" role="tab" aria-selected="${lbTab === m}">${MODE_NAME[m]}</button>`).join('')}</div>`; }
function rowsHtml(rows) {
  if (!rows.length) return '<table class="lb"><tr><td colspan="3">No scores yet. Be the first! 🦄</td></tr></table>';
  return '<table class="lb">' + rows.map((r, i) => `<tr class="${r.p && r.p === myPid ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][i] || (r.r || i + 1) + '.'}</td><td>${esc(r.n)}${r.p && r.p === myPid ? ' (you)' : ''}</td><td>${r.s}</td></tr>`).join('') + '</table>';
}
function recentMissing(b, m) { const rc = LS.get('rb_recent', null); return !!(rc && rc.mode === m && Date.now() - rc.at < 120000 && !b.rows.some(x => x.p === myPid)); }
async function lbScreen(tab, force) {
  if (tab) lbTab = tab; const m = lbTab; st = st === 'pause' ? st : 'menu';
  if (!CONFIG.API_URL) {
    screen(`<h1>🏆 Leaderboard</h1>${tabs()}<p class="meta warn">Local scores on this device. Not verified.</p>${rowsHtml(localBoard(m).map((r, i) => ({ r: i + 1, n: r.n, s: r.s })))}<button data-a="menu">← Back</button>`); return;
  }
  const cached = LS.get('rb_lbc_' + m, null);
  const paint = (b, loading) => screen(`<h1>🏆 Leaderboard</h1>${tabs()}
    <p class="meta">${b ? `${esc(b.season)} · <span class="okc">✓ verified by server</span> · ${b.players} players · updated ${ago(b.updated)}${b.stale ? ' <span class="warn">(offline copy)</span>' : ''}` : (loading ? 'Loading…' : '<span class="warn">Can’t reach the leaderboard right now.</span>')}</p>
    ${b && recentMissing(b, m) ? `<p class="meta okc">✓ Your score of ${LS.get('rb_recent', {}).score} was verified. It will show up here within a minute.</p>` : ''}
    ${b ? rowsHtml(b.rows) : ''}<div class="row"><button class="sec" data-a="menu">← Back</button><button class="sec" data-a="lbr">↻ Refresh</button></div>`);
  paint(cached, true);
  const b = await fetchBoard(m, force); if (box.querySelector('h1') && box.querySelector('h1').textContent.indexOf('Leaderboard') < 0) return;
  if (lbTab !== m) return;
  paint(b, false);
  lbTimer = setInterval(async () => { const nb = await fetchBoard(m, true); if (nb && lbTab === m && box.querySelector('table.lb') && box.textContent.indexOf('Leaderboard') >= 0) paint(nb, false); }, 40000 + Math.random() * 15000);
}
function overScreen() {
  const r = run; let h = `<h1>${r.score >= 100 ? 'Amazing! 🎉' : 'Great job! 🎉'}</h1><p class="big">You scored <b>${r.score}</b></p>
  <p class="meta">${MODE_NAME[r.mode]} · max combo ${r.combo} · level ${r.level} · ${r.secs}s${r.isBest ? ' · <b>new personal best!</b>' : ''}</p>`;
  let play = `<div class="row"><button data-a="again">Play again 🦄</button><button class="sec" data-a="lb">🏆 Board</button></div><button class="sec" data-a="menu">Menu</button>`;
  if (MODES[r.mode].ranked && r.token) {
    h += `<div id="sub"><p>Enter your name to join the leaderboard:</p>
    <input id="nm" type="text" maxlength="12" placeholder="Your name" value="${esc(prof.name)}" autocomplete="nickname"><br>
    <input id="ct" type="tel" maxlength="16" placeholder="Mobile number (for prizes)" value="${esc(prof.contact)}" autocomplete="tel">
    <p class="meta">Your number is private. Staff use it only to confirm prizes.</p><button id="subbtn" data-a="submit">Submit score 🏆</button><p id="msg" class="meta"></p></div><div id="after" style="display:none">${play}</div>`;
  } else if (MODES[r.mode].ranked && !CONFIG.API_URL) {
    const lb = localBoard(r.mode), q = r.score > 0 && (lb.length < 10 || r.score > lb[lb.length - 1].s);
    h += q ? `<div id="sub"><p>Top 10 on this device! Enter your name:</p><input id="nm" type="text" maxlength="12" placeholder="Your name" value="${esc(prof.name)}"><br><button id="subbtn" data-a="local">Save score 🏆</button></div><div id="after" style="display:none">${play}</div>` : play;
  } else if (MODES[r.mode].ranked) h += `<p class="meta warn">This run wasn’t ranked because the connection was down when it started. Only ranked runs count for prizes.</p>${play}`;
  else h += play;
  h += '<p class="meta">Come sip magic at Rainbrew Coffee Shop ☕🌈</p>';
  screen(h);
}
const ERR = { mismatch: 'The score didn’t match the server’s check.', timing: 'The run timing looked invalid.', clock: 'The run was longer than the time that passed.', used: 'This run was already submitted.', rate: 'Too many submissions. Try again in a bit.', expired: 'This session expired. Play again to get a new one.', name: 'Please enter a name.', token: 'This run could not be verified.', version: 'Please reload the page to get the latest game version.' };
async function submitScore() {
  const nm = $('nm').value.trim().slice(0, 12), ct = $('ct').value.trim(), msg = $('msg'), btn = $('subbtn');
  if (!nm) { msg.textContent = 'Please enter a name.'; return; }
  prof.name = nm; prof.contact = ct; LS.set('rb_prof', prof); btn.disabled = true; msg.textContent = 'Submitting…';
  const p = { action: 'submit', token: run.token, did, name: nm, contact: ct, score: run.score, tEnd: run.tEnd, ev: run.ev, mode: run.mode, v: CONFIG.VERSION };
  const r = await retry(() => api('POST', null, p, 15000), 4);
  if (r.ok) { run.done = 1; saveTicket(r, p); ticketScreen(r); return; }
  if (['net', 'busy', 'server', 'rate'].indexOf(r.err) >= 0) {
    const q = LS.get('rb_pending', []); q.push(p); LS.set('rb_pending', q.slice(-5));
    msg.innerHTML = '<span class="warn">Couldn’t reach the server. Your score is saved and will upload automatically. Keep this page open.</span>'; $('after').style.display = 'block'; btn.style.display = 'none'; return;
  }
  msg.innerHTML = `<span class="warn">${esc(ERR[r.err] || 'Could not submit (' + r.err + ').')}</span>`; btn.disabled = false;
  if (r.err !== 'name') { $('after').style.display = 'block'; btn.style.display = 'none'; }
}
function ticketScreen(r) {
  screen(`<h1>Score verified ✅</h1><div class="ticket"><div class="meta">Verification code</div><div class="code" id="code">${esc(r.code)}</div>
  <div class="meta">${run.score} pts · ${MODE_NAME[run.mode]}${r.rank ? ' · about #' + r.rank : ''}</div></div>
  <p class="meta">Take a screenshot. If you finish in the prize ranks, show this code to Rainbrew staff. The leaderboard updates within a minute.</p>
  <button data-a="copy">Copy code</button><div class="row"><button data-a="again">Play again 🦄</button><button class="sec" data-a="lb">🏆 Board</button></div><button class="sec" data-a="menu">Menu</button>`);
}
function saveLocal() {
  const nm = $('nm').value.trim() || 'Unicorn'; prof.name = nm; LS.set('rb_prof', prof);
  const lb = localBoard(run.mode); lb.push({ n: nm, s: run.score }); lb.sort((a, b) => b.s - a.s); LS.set('rb_local_' + run.mode, lb.slice(0, 10)); lbTab = run.mode; lbScreen();
}

/* ============ actions & input ============ */
const ACT = {
  play() { startGame(mode); }, again() { startGame(run ? run.mode : mode); }, menu, how, prof: profile, set() { backFn = st === 'pause' ? pauseScreen : menu; settings(); }, back() { (backFn || menu)(); backFn = null; },
  lb() { lbScreen(mode === 'rush' ? 'rush' : 'classic'); }, lbr() { lbScreen(null, true); }, submit: submitScore, local: saveLocal,
  resume() { ov.style.display = 'none'; st = 'play'; musicStart(); },
  endrun() { ov.style.display = 'none'; st = 'play'; endRun(); },
  quit() { st = 'menu'; menu(); },
  copy(b) { const c = $('code').textContent; try { navigator.clipboard.writeText(c); b.textContent = 'Copied ✓'; } catch (e) { b.textContent = c; } }
};
box.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; auInit(); sfx('click');
  const [a, x, y] = b.dataset.a.split(':');
  if (a === 'mode') { mode = x; LS.set('rb_mode', mode); menu(); }
  else if (a === 'tab') lbScreen(x);
  else if (a === 'cfg') { cfg[x] = y; saveCfg(); if (x === 'quality') resize(); settings(); }
  else if (ACT[a]) ACT[a](b);
});
box.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k) { const k = el.dataset.k; cfg[k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : +el.value; saveCfg(); if (k === 'sfx') sfx('catch', 2); if (k === 'mute' && !cfg.mute) sfx('click'); }
  else if (el.dataset.p) { prof[el.dataset.p] = el.value; LS.set('rb_prof', prof); }
});
function pauseGame() { if (st === 'play') pauseScreen(); }
cv.addEventListener('pointermove', e => { tx = e.clientX; });
cv.addEventListener('pointerdown', e => {
  auInit(); tx = e.clientX;
  if (st === 'play' && Math.hypot(e.clientX - (W - S * .6), e.clientY - (S * 1.35)) < S * .45) pauseGame();
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.l = 1; if (k === 'arrowright' || k === 'd') keys.r = 1;
  if (k === 'p' || k === 'escape') { if (st === 'play') pauseGame(); else if (st === 'pause') ACT.resume(); }
  if (k === 'm') { cfg.mute = cfg.mute ? 0 : 1; saveCfg(); say(cfg.mute ? '🔇 Muted' : '🔊 Sound on', .9); }
  if ((k === 'enter' || k === ' ') && st === 'menu' && ov.style.display !== 'none' && e.target.tagName !== 'BUTTON') { e.preventDefault(); startGame(mode); }
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') keys.l = 0; if (k === 'arrowright' || k === 'd') keys.r = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('blur', pauseGame);
addEventListener('online', () => flushPending());
addEventListener('resize', resize);

function loop(n) {
  const dt = Math.min(.05, Math.max(0, (n - last) / 1000) || 0); last = n; if (dt > 0) fpsA += (1 / dt - fpsA) * .05;
  update(dt); draw(); requestAnimationFrame(loop);
}
resize(); px = tx = W / 2; menu(); flushPending(); setInterval(flushPending, 60000);
requestAnimationFrame(loop);
</script></body></html>
