<style>
:root{--card:rgba(255,255,255,.9);--ink:#5b3b8c;--soft:rgba(91,59,140,.12);--btn:#ff8fcf;--btn2:#b69cff;--ok:#2f9e6b;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#e56bb8;--btn2:#8a6cf0;--ok:#6ee7a8;--warn:#fdba74}}
:root[data-theme="dark"]{--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#e56bb8;--btn2:#8a6cf0;--ok:#6ee7a8;--warn:#fdba74}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#cdb8ff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
#box{background:var(--card);border-radius:28px;padding:18px 22px;max-width:420px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(120,60,180,.35);backdrop-filter:blur(6px)}
#box img.logo{width:min(200px,50vw);height:auto}
h1{margin:4px 0;font-size:1.6rem;line-height:1.15}h2{margin:10px 0 4px;font-size:1.05rem}
p{margin:6px 0;font-size:1rem;line-height:1.4}.meta{font-size:.82rem;opacity:.8}.big{font-size:1.25rem}.warn{color:var(--warn)}.okc{color:var(--ok)}
ol{text-align:left;margin:8px 0;padding-left:1.3em;font-size:.95rem;line-height:1.45}li{margin:4px 0}
input[type=text],input[type=tel]{font:inherit;font-size:1.05rem;padding:8px 14px;border-radius:999px;border:2px solid var(--btn2);width:80%;max-width:260px;text-align:center;color:var(--ink);background:transparent;margin:4px 0;box-sizing:border-box}
button{margin-top:10px;font:inherit;font-weight:700;font-size:1.15rem;color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;background:linear-gradient(90deg,var(--btn),var(--btn2));box-shadow:0 4px 14px rgba(150,80,200,.4)}
button:active{transform:scale(.96)}button:disabled{opacity:.55;cursor:default}
button.sec{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--btn2);font-size:1rem;padding:9px 18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.row button{margin-top:8px}
.chips{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.chip{flex:1;margin:0;padding:8px 4px;font-size:.95rem;border-radius:18px;background:transparent;color:var(--ink);border:2px solid var(--btn2);box-shadow:none;line-height:1.2}
.chip small{display:block;font-weight:400;font-size:.68rem;opacity:.8;margin:2px 0 0}
.chip.on{background:linear-gradient(90deg,var(--btn),var(--btn2));color:#fff;border-color:transparent}
.tabs{display:flex;gap:6px;justify-content:center}.tabs .chip{flex:0 1 120px}

.set{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:7px 0;border-bottom:1px solid var(--soft);font-size:.95rem}
.set input[type=range]{width:46%}.set input[type=checkbox]{width:22px;height:22px;accent-color:#b69cff}
.set .chips{margin:0;flex:1}.set .chip{padding:5px 2px;font-size:.82rem}
.ticket{border:2px dashed var(--btn2);border-radius:18px;padding:10px;margin:10px 0}
.ticket .code{font-size:1.7rem;font-weight:800;letter-spacing:.08em;font-family:ui-monospace,Menlo,Consolas,monospace}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}

.stat{display:flex;justify-content:space-around;margin:8px 0}.stat div{font-size:.78rem;opacity:.85}.stat b{display:block;font-size:1.2rem;opacity:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:12px 0 8px}
.pod{flex:1;min-width:0;border-radius:18px 18px 8px 8px;padding:8px 4px 8px;border:2px solid var(--soft);background:var(--soft)}
.pod .medal{font-size:1.7rem;line-height:1.1}.pod .crown{font-size:1.25rem;line-height:1}
.pod .pn{font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}.pod .ps{font-weight:800;font-size:1.15rem}
.pod.p1{min-height:136px;padding-top:10px;border-color:#f5b700;background:linear-gradient(180deg,rgba(255,205,60,.42),rgba(255,205,60,.08));box-shadow:0 0 18px rgba(255,200,40,.35)}
.pod.p1 .medal{font-size:2.4rem}.pod.p1 .ps{font-size:1.5rem}
.pod.p2{min-height:108px;border-color:#aab4c4;background:linear-gradient(180deg,rgba(190,200,215,.45),rgba(190,200,215,.08))}
.pod.p3{min-height:92px;border-color:#cd7f32;background:linear-gradient(180deg,rgba(205,127,50,.4),rgba(205,127,50,.08))}
.pod.me{outline:3px solid var(--btn2);outline-offset:1px}
.chips.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chips.grid .chip{padding:9px 6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);margin-top:10px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.skin{margin:0;padding:8px 4px;border-radius:16px;background:transparent;color:var(--ink);border:2px solid var(--soft);box-shadow:none;font-size:.78rem;line-height:1.2;font-weight:400}
.skin b{display:block;font-size:1.9rem;line-height:1.2}.skin.on{border-color:var(--btn2);background:var(--soft)}.skin.lock{opacity:.55}
.steps{text-align:left;font-size:.95rem;line-height:1.5;padding-left:1.3em}.note{border-radius:12px;background:var(--soft);padding:8px 10px;font-size:.85rem;margin:8px 0}
small.foot{display:block;margin-top:12px;opacity:.7;font-size:.72rem}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

<script>
'use strict';
/* ===== RULES v3 — identical in index.html and Code.gs. Do not edit one without the other. ===== */
var RULES_VERSION = 3;
var POINTS = { f: 1, s: 2, p: 2, b: 3, c: 3, t: 4, m: 4 };           // fries, salad, pizza, burger, chicken, tea, matcha
var GOODS = ['f', 'f', 's', 'p', 'p', 'b', 'c', 't', 'm'];
var START_LIVES = 3, MAX_LIVES = 5, LOGO_PTS = 25, DBL_MS = 10000, MAGNET_MS = 8000, SLOW_MS = 5000, MAX_MULT = 8;
var INV_MS = 1200;                                                    // safety window after a hit: further hits are ignored
var BONUS_EVERY = 150;                                                // a bonus life every 150 points (up to MAX_LIVES)
var GRACE_SECS = 6;                                                   // no ghosts or pumpkins in the first 6 seconds
var BOSS_EVERY = 10, BOSS_GAP = 0.55, ORB_PTS = 5, BOSS_BONUS = 100, INF_PEN = 10;
var MIN_FALL = 0.25, MAX_FALL = 45;                                   // seconds an item may take from spawn to catch/miss
// lvsec = seconds per level, dscale/cap = how fast and how far difficulty climbs, dur = timer (0 = none), max = longest allowed run (seconds)
var MODES = {
  classic:  { ranked: 1, lives: 3, lvsec: 20, dscale: 1,  cap: 8,  dur: 0,  max: 1800 },
  rank:     { ranked: 1, lives: 3, lvsec: 12, dscale: .6, cap: 12, dur: 0,  max: 1800, boss: 1 },
  rush:     { ranked: 1, lives: 5, lvsec: 13, dscale: 1,  cap: 12, dur: 60, max: 60 },
  infinite: { ranked: 1, lives: 3, lvsec: 20, dscale: 1,  cap: 12, dur: 0,  max: 900, inf: 1 }
};

function mulberry32(a) {
  return function () {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function levelAt(sec, mode) { return 1 + Math.floor(sec / (MODES[mode] || MODES.classic).lvsec); }
function diffAt(lv, mode) { var M = MODES[mode] || MODES.classic; return Math.min(M.cap, 1 + (lv - 1) * M.dscale); }
function pBad(d) { return Math.min(0.38, 0.08 + d * 0.025); }
function gapFor(d) { return Math.max(0.34, 0.95 - d * 0.045); }
function bossHp(n) { return Math.min(12, 4 + 2 * n); }
function bossSecs(n) { return Math.min(40, 20 + 4 * (n - 1)); }      // later bosses fight longer, so there are always plenty of orbs to win

// Every item that will ever spawn is decided by the server-issued seed.
// k: good-item letter | 'x' ghost/pumpkin | 'L' Rainbrew logo | 'G' magnet | 'H' shield | 'W' slow-mo | 'D' double points | 'U' extra life
//    | 'O' boss orb (catch to damage the boss) | 'B' boss arrives (marker, not catchable) | 'E' boss window over (marker)
function makeSchedule(seed, mode) {
  var M = MODES[mode] || MODES.classic, r = mulberry32(seed >>> 0), i = 0, T = 0.8, bn = 0, inB = false, bEnd = 0, bj = 0;
  return {
    next: function () {
      var lv = levelAt(T, mode);
      if (M.boss && !inB && lv >= BOSS_EVERY * (bn + 1)) { bn++; inB = true; bj = 0; bEnd = T + bossSecs(bn); return { i: i++, T: T, k: 'B', lv: lv, d: 0, ghost: false, fx: 0.5, v: 0, w: 0, bn: bn }; }
      if (inB && T >= bEnd) { inB = false; return { i: i++, T: T, k: 'E', lv: lv, d: 0, ghost: false, fx: 0.5, v: 0, w: 0, bn: bn }; }
      var d = diffAt(lv, mode);
      var r1 = r(), r2 = r(), r3 = r(), r4 = r(), r5 = r(), r6 = r(), r7 = r();
      var k;
      if (inB) k = (bj++ % 3 === 0 || r1 < 0.15) ? 'O' : r1 < 0.55 ? 'x' : r1 < 0.62 ? 'H' : r1 < 0.67 ? 'U' : GOODS[Math.floor(r2 * GOODS.length)];   // every 3rd item is an orb: the boss can always be beaten
      else if (r1 < pBad(d) && T >= GRACE_SECS) k = 'x';
      else if (r3 < 0.07) k = 'L';
      else if (r3 < 0.14) k = r2 < 0.25 ? 'G' : r2 < 0.5 ? 'H' : r2 < 0.7 ? 'W' : r2 < 0.92 ? 'D' : 'U';
      else k = GOODS[Math.floor(r2 * GOODS.length)];
      var it = { i: i, T: T, k: k, lv: lv, d: d, ghost: r2 < 0.5, fx: r4, v: (85 + Math.min(d, M.cap) * 14) * (0.85 + r5 * 0.4) * (inB ? 0.95 : 1), w: r6 * 6, bn: inB ? bn : 0 };
      i++; T += (inB ? BOSS_GAP : gapFor(d)) * (0.85 + r7 * 0.3);
      return it;
    }
  };
}

function newState(mode) {
  var M = MODES[mode] || MODES.classic;
  return { score: 0, combo: 0, maxCombo: 0, catches: 0, lives: M.lives, shield: 0, dbl: -1, inv: -1, nextLife: BONUS_EVERY, over: 0, inf: M.inf ? 1 : 0, bossN: 0, bossHp: 0, bossDone: 1, bosses: 0 };
}

function addScore(S, n) {
  S.score += n;
  while (S.score >= S.nextLife) { S.nextLife += BONUS_EVERY; if (S.lives < MAX_LIVES) S.lives++; }
}
function bossInit(S, bn) { if (S.bossN !== bn) { S.bossN = bn; S.bossHp = bossHp(bn); S.bossDone = 0; } }

// t = integer game-time milliseconds, a = 'c' caught | 'x' hit a baddie | 'm' missed an item, k = item kind, bn = boss number (boss orbs)
function applyEvent(S, t, a, k, bn) {
  var d = S.dbl >= t ? 2 : 1;
  if (a === 'm') {
    if (k === 'O') { bossInit(S, bn); if (!S.bossDone) S.bossHp = Math.min(bossHp(bn), S.bossHp + 1); }   // a missed orb heals the boss
    else S.combo = 0;
    return;
  }
  if (a === 'x') {
    if (S.inv >= t) return;                                           // still in the safety window after the last hit
    S.inv = t + INV_MS;
    if (S.shield) { S.shield = 0; return; }
    if (S.inf) { S.score = Math.max(0, S.score - INF_PEN); S.combo = 0; return; }   // Infinite: no lives, a hit costs points
    S.lives--; S.combo = 0; if (S.lives <= 0) S.over = 1;
    return;
  }
  if (k === 'O') {
    bossInit(S, bn);
    if (!S.bossDone) {
      S.bossHp--; addScore(S, ORB_PTS * d);
      if (S.bossHp <= 0) { S.bossDone = 1; S.bosses++; addScore(S, BOSS_BONUS * bn); S.lives = Math.min(MAX_LIVES, S.lives + 1); }
    }
    return;
  }
  if (k === 'L') { addScore(S, LOGO_PTS * d); return; }
  if (k === 'G' || k === 'W') return;                                 // movement/visual effects only
  if (k === 'H') { S.shield = 1; return; }
  if (k === 'D') { S.dbl = t + DBL_MS; return; }
  if (k === 'U') { S.lives = Math.min(MAX_LIVES, S.lives + 1); return; }
  S.combo++; if (S.combo > S.maxCombo) S.maxCombo = S.combo; S.catches++;
  addScore(S, POINTS[k] * Math.min(MAX_MULT, 1 + Math.floor(S.combo / 5)) * d);
}
/* ===== END RULES ===== */

/* ============ network (never blocks the game loop) ============ */
async function api(method, params, body, ms) {
  if (!HAS_NET) throw new Error('no fetch');
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, to = ctl ? setTimeout(() => ctl.abort(), ms || 10000) : 0;
  try {
    const url = CONFIG.API_URL + (method === 'GET' ? '?' + new URLSearchParams(params).toString() : '');
    const sig = ctl ? { signal: ctl.signal } : {};
    const r = await fetch(url, method === 'GET' ? Object.assign({ redirect: 'follow' }, sig) : Object.assign({ method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' }, sig));
    return await r.json();
  } finally { clearTimeout(to); }
}
async function retry(fn, tries) {
  let lastR = { ok: false, err: 'net' };
  for (let i = 0; i < tries; i++) {
    try { const r = await fn(); if (r && (r.ok || ['slow', 'busy', 'server'].indexOf(r.err) < 0)) return r; lastR = r || lastR; } catch (e) { lastR = { ok: false, err: 'net' }; }
    if (i < tries - 1) await sleep(Math.min(6000, 600 * Math.pow(2, i)) + Math.random() * 400);   // exponential back-off with jitter spreads out crowds
  }
  return lastR;
}
async function fetchPage(m, off) {
  const params = { action: 'lb', mode: m, off, n: 100 }; if (myPid) { params.pid = myPid; params.me = 1; }
  try {
    const r = await retry(() => api('GET', params), 2);
    if (r && r.ok) { noteSeason(r.season); if (off === 0) LS.set('rb_lbc_' + m, { season: r.season, players: r.players, updated: r.updated, rows: r.rows }); return r; }
  } catch (e) {}
  return null;
}
let flushing = false;
const pendingList = () => LS.get('rb_pending', []);
function enqueue(p) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // a score is waiting on this device: ask the browser not to clear it
  const q = pendingList(); if (!q.some(x => x.token === p.token)) q.push(Object.assign({ at: Date.now(), tries: 0, next: 0 }, p)); LS.set('rb_pending', q.slice(-20)); }
// Safe to repeat (the server returns the same code for the same run). "Full jitter" back-off spreads a crowd out instead of hammering a busy server.
async function trySubmit(p, budgetMs, onBusy) {
  const t0 = Date.now(); let i = 0, last = { ok: false, err: 'net' };
  while (Date.now() - t0 < budgetMs) {
    try { last = await api('POST', null, p, 20000); if (last && (last.ok || ['busy', 'server', 'rate'].indexOf(last.err) < 0)) return last; last = last || { ok: false, err: 'net' }; } catch (e) { last = { ok: false, err: 'net' }; }
    if (isOffline()) break;
    if (onBusy) onBusy(Math.round((Date.now() - t0) / 1000));
    await sleep(300 + Math.random() * Math.min(8000, 1000 * Math.pow(2, i++)));
  }
  return last;
}
async function flushPending(force) {
  let q = pendingList(); if (flushing || !q.length || !ONLINE || isOffline()) return;
  const now = Date.now(); if (force) q.forEach(p => { p.next = 0; });
  if (!q.some(p => !p.next || p.next <= now)) return;
  flushing = true; let okN = 0;
  try {
    for (const p of q) {
      if (p.next && p.next > Date.now()) continue;                              // not due yet: each saved score has its own staggered retry time
      const r = await trySubmit(p, 15000);
      if (r.ok) { saveTicket(r, p); okN++; p.done = 1; }
      else if (['net', 'busy', 'server', 'rate'].indexOf(r.err) >= 0) { p.tries = (p.tries || 0) + 1; p.next = Date.now() + (4 + Math.random() * Math.min(116, 4 * Math.pow(2, p.tries))) * 1000; }
      else p.done = 1;                                                           // a final answer (for example an expired session): stop retrying
    }
    LS.set('rb_pending', q.filter(p => !p.done));
  } finally { flushing = false; }
  if (okN) { menuNote = '✓ ' + okN + ' saved score' + (okN > 1 ? 's' : '') + ' uploaded'; if (curScr === 'menu' && st === 'menu') menu(); else if (st === 'play') say('✓ Saved score uploaded', 1.6); }
}
function saveTicket(r, p) {
  myPid = r.pid; LS.set('rb_pid', myPid);
  if (!tickets.some(x => x.code === r.code)) tickets.unshift({ code: r.code, score: r.score, mode: p.mode || mode, season: r.season, at: Date.now() });
  tickets = tickets.slice(0, 12); LS.set('rb_tickets', tickets);
  LS.set('rb_recent', { mode: p.mode || mode, score: r.score, at: Date.now() }); LS.set('rb_lbc_' + (p.mode || mode), null);
}

  screen(`<h1>🎖 Profile</h1>
  <div class="stat"><div><b>${stats.games}</b>games</div><div><b>${stats.catches}</b>treats caught</div><div><b>${n}/${total}</b>badges</div></div>
  <div class="stat">${MODE_ORDER.map(m => `<div><b>${stats.best[m] || 0}</b>${MODE_NAME[m]}</div>`).join('')}</div>
  <h2>Your character</h2><div class="skins">${SKINS.map(x => { const ok = x.u(); return `<button class="skin${cfg.skin === x.e && ok ? ' on' : ''}${ok ? '' : ' lock'}" ${ok ? `data-a="skin:${x.e}"` : 'disabled'} aria-label="${x.n}"><b>${ok ? x.e : '🔒'}</b>${x.n}<br>${ok ? '' : x.how}</button>`; }).join('')}</div>
  <div class="badges">${Object.keys(ACH).map(k => `<div class="badge${ach[k] ? ' on' : ''}"><b>${ach[k] ? '🎖' : '🔒'} ${ACH[k][0]}</b>${ACH[k][1]}</div>`).join('')}</div>
  ${pend.length || tickets.length ? `<h2>My scores and verification codes</h2><table class="lb">${pend.map(x => `<tr><td>⏳</td><td>Waiting to upload<br><span class="meta">${MODE_NAME[x.mode] || ''} · will get a code when online</span></td><td>${x.score}</td></tr>`).join('')}${tickets.map(x => `<tr><td></td><td>${esc(x.code)}<br><span class="meta">${MODE_NAME[x.mode] || ''} · ${new Date(x.at).toLocaleDateString()}</span></td><td>${x.score}</td></tr>`).join('')}</table>` : ''}
  <button data-a="menu">← Back</button>`);
}
function pauseScreen() {
  st = 'pause'; musicStop();
  screen(`<h1>Paused ⏸</h1><p class="meta">${MODE_NAME[mode]} · score ${S0.score} · level ${lv}</p><button data-a="resume">Resume ▶</button><p class="meta">You get a 3-2-1 before it continues.</p>
  <div class="row"><button class="sec" data-a="set">⚙️ Settings</button><button class="sec" data-a="endrun">End run</button></div>
  <button class="sec" data-a="quit">Quit to menu</button>`);
}
function endConfirm() {
  screen(`<h1>End this run?</h1><p>Your score so far (<b>${S0.score}</b>) will be ${ranked ? 'ready to submit' : 'saved'}. You can’t continue this run afterwards.</p>
  <button data-a="endyes">Yes, end run</button><br><button class="sec" data-a="pausebk">Keep playing</button>`);
}

/* ---------- leaderboard: podium for the top 3, then everyone else ---------- */
function ago(ms) { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; }
function localBoard(m) { return LS.get('rb_local_' + m, []); }
function tabs() { return `<div class="tabs" role="tablist">${MODE_ORDER.map(m => `<button class="chip${lbTab === m ? ' on' : ''}" data-a="tab:${m}" role="tab" aria-selected="${lbTab === m}">${m === 'rank' ? '🏆 ' : ''}${MODE_NAME[m]}</button>`).join('')}</div>`; }
function podium(rows) {
  if (!rows.length) return '';
  const pod = (r, c, medal, crown) => r ? `<div class="pod ${c}${r.p && r.p === myPid ? ' me' : ''}">${crown ? '<div class="crown">👑</div>' : ''}<div class="medal">${medal}</div><div class="pn">${esc(r.n)}</div><div class="ps">${r.s}</div></div>` : '';
  return `<div class="podium" aria-label="Top three">${pod(rows[1], 'p2', '🥈')}${pod(rows[0], 'p1', '🥇', 1)}${pod(rows[2], 'p3', '🥉')}</div>`;
}
function restRows(rows) {
  if (rows.length <= 3) return '';
  return '<table class="lb">' + rows.slice(3).map((r, i) => `<tr class="${r.p && r.p === myPid ? 'me' : ''}"><td>${r.r || i + 4}.</td><td>${esc(r.n)}${r.p && r.p === myPid ? ' (you)' : ''}</td><td>${r.s}</td></tr>`).join('') + '</table>';
}
function recentMissing(m) { const rc = LS.get('rb_recent', null); return !!(rc && rc.mode === m && Date.now() - rc.at < 120000 && !lbRows.some(x => x.p === myPid) && !lbMe); }
function paintLb(loading) {
  const m = lbTab, b = lbMeta, rows = lbRows;
  const status = b ? `${esc(b.season)} · <span class="okc">✓ verified by server</span> · ${b.players} player${b.players === 1 ? '' : 's'} · updated ${ago(b.updated)}${b.stale ? ' <span class="warn">(offline copy)</span>' : ''}` : (loading ? 'Loading…' : '<span class="warn">Can’t reach the leaderboard right now.</span>');
  const meOut = lbMe && !rows.some(x => x.p === myPid);
  screen(`<h1>🏆 Leaderboards</h1>${tabs()}<p class="meta">${status}</p>
  ${m === 'rank' ? '<p class="meta">🏆 Rank is the prize mode.</p>' : ''}${meOut ? `<p class="meta okc">You are #${lbMe.r} with ${lbMe.s} pts</p>` : ''}${recentMissing(m) ? `<p class="meta okc">✓ Your score of ${LS.get('rb_recent', {}).score} was verified. It will show up here within a minute.</p>` : ''}
  ${b && !rows.length && !loading ? '<p>No scores yet. Be the first! 🦄</p>' : ''}${podium(rows)}${restRows(rows)}
  ${b && rows.length < b.players ? `<button class="sec" data-a="more">Show more (${b.players - rows.length} more)</button>` : ''}
  <div class="row"><button class="sec" data-a="menu">← Back</button><button class="sec" data-a="lbr">↻ Refresh</button></div>`, 'lb');
}
async function lbScreen(tab, force) {
  if (tab) lbTab = tab; const m = lbTab; st = st === 'pause' ? st : 'menu';
  if (!ONLINE) {
    const rows = localBoard(m).map((r, i) => ({ r: i + 1, n: r.n, s: r.s }));
    screen(`<h1>🏆 Leaderboards</h1>${tabs()}<p class="meta warn">Local scores on this device. Not verified.</p>${rows.length ? podium(rows) + restRows(rows) : '<p>No scores yet. Be the first! 🦄</p>'}<button data-a="menu">← Back</button>`, 'lb'); return;
  }
  const seq = ++lbSeq; lbRows = []; lbMeta = null; lbMe = null;
  const c = force ? null : LS.get('rb_lbc_' + m, null);
  if (c && c.rows) { lbRows = c.rows; lbMeta = Object.assign({}, c, { stale: 1 }); }
  paintLb(!c);
  const r = await fetchPage(m, 0);
  if (seq !== lbSeq || curScr !== 'lb') return;
  if (r) { lbRows = r.rows; lbMeta = r; lbMe = r.me || null; }
  paintLb(false);
  clearInterval(lbTimer); lbTimer = setInterval(refreshLb, 45000 + Math.random() * 15000);
}
async function refreshLb() {
  if (curScr !== 'lb' || lbRows.length > 100) return;                               // don't disturb someone who has scrolled through more pages
  const seq = lbSeq, r = await fetchPage(lbTab, 0);
  if (!r || seq !== lbSeq || curScr !== 'lb' || (lbMeta && r.updated === lbMeta.updated && !lbMeta.stale)) return;
  lbRows = r.rows; lbMeta = r; lbMe = r.me || null; paintLb(false);
}
async function moreLb(b) {
  b.disabled = true; b.textContent = 'Loading…';
  const seq = lbSeq, r = await fetchPage(lbTab, lbRows.length);
  if (seq !== lbSeq || curScr !== 'lb') return;
  if (r) { const have = {}; lbRows.forEach(x => have[x.p] = 1); lbRows = lbRows.concat(r.rows.filter(x => !have[x.p])); lbMeta = r; lbMe = r.me || lbMe; }
  paintLb(false);
}

/* ---------- game over / submit ---------- */
const HEAD = { lives: 'Out of lives 💔', time: 'Time’s up! ⏱', quit: 'Run ended', cap: 'Time cap reached 🏁' };
function overScreen() {
  const r = run; let h = `<h1>${HEAD[r.reason] || 'Great job!'}</h1><p class="big">You scored <b>${r.score}</b></p>
  ${r.unlocked && r.unlocked.length ? `<p class="note">🔓 New character unlocked: <b>${r.unlocked.map(x => x.e + ' ' + x.n).join(', ')}</b>. Pick it in Profile.</p>` : ''}
  <p class="meta">${MODE_NAME[r.mode]} · max combo ${r.combo} · level ${r.level}${r.bosses ? ' · ' + r.bosses + ' boss' + (r.bosses > 1 ? 'es' : '') + ' beaten 👹' : ''} · ${r.secs}s${r.isBest ? ' · <b>new personal best!</b>' : ''}</p>`;
  const play = `<div class="row"><button data-a="again">Play again 🦄</button><button class="sec" data-a="lb">🏆 Board</button></div><div class="row"><button class="sec" data-a="share">📣 Share</button><button class="sec" data-a="menu">Menu</button></div>`;
  if (MODES[r.mode].ranked && r.token) {
    h += `<div id="sub"><p>Enter your name to join the leaderboard:</p>
    <input id="nm" type="text" maxlength="12" placeholder="Your name" value="${esc(prof.name)}" autocomplete="nickname"><br>
    <input id="ct" type="tel" maxlength="16" placeholder="${r.mode === 'rank' ? 'Mobile number (required for prizes)' : 'Mobile number (optional)'}" value="${esc(prof.contact)}" autocomplete="tel" inputmode="tel">
    <p class="meta">Your number is private. Staff use it only to confirm prizes.${r.mode === 'rank' ? ' Rank needs a Philippine mobile number.' : ''}</p>${isOffline() ? '<p class="meta warn">📴 You’re offline. Your score is saved on this device and uploads automatically when you’re back online.</p>' : ''}<button id="subbtn" data-a="submit">${isOffline() ? 'Save score 💾' : 'Submit score 🏆'}</button><p id="msg" class="meta"></p></div><div id="after" style="display:none">${play}</div>`;
  } else if (MODES[r.mode].ranked && !ONLINE) {
    const lb = localBoard(r.mode), q = r.score > 0 && (lb.length < 10 || r.score > lb[lb.length - 1].s);
    h += q ? `<div id="sub"><p>Top 10 on this device! Enter your name:</p><input id="nm" type="text" maxlength="12" placeholder="Your name" value="${esc(prof.name)}"><br><button id="subbtn" data-a="local">Save score 🏆</button></div><div id="after" style="display:none">${play}</div>` : play;
  } else if (MODES[r.mode].ranked) h += `<p class="meta warn">This run wasn’t ranked because no ranked session was available (you were offline, or the server was too slow). Connect to the internet once and the game will save ranked sessions for next time. Only ranked runs count for prizes.</p>${play}`;
  else h += play;
  h += '<p class="meta">Come sip magic at Rainbrew Coffee Shop ☕🌈</p>';
  screen(h);
}
const validPH = s => { const d = String(s || '').replace(/\D/g, ''); return /^09\d{9}$/.test(d) || /^639\d{9}$/.test(d); };
const ERR = { contact: 'Rank needs a Philippine mobile number (like 0917 123 4567) so staff can reach winners.', mismatch: 'The score didn’t match the server’s check.', timing: 'The run timing looked invalid.', clock: 'The run was longer than the time that passed.', used: 'This run was already submitted.', rate: 'Too many submissions. Try again in a bit.', expired: 'This session expired. Play again to get a new one.', name: 'Please enter a name.', token: 'This run could not be verified.', version: 'The game was updated. Please reload the page and play again.' };
let submitting = false;
async function submitScore() {
  if (submitting) return;
  const nm = $('nm').value.trim().slice(0, 12), ct = $('ct').value.trim(), msg = $('msg'), btn = $('subbtn');
  if (!nm) { msg.textContent = 'Please enter a name.'; return; }
  if (run.mode === 'rank' && !validPH(ct)) { msg.innerHTML = '<span class="warn">' + esc(ERR.contact) + '</span>'; return; }
  submitting = true; prof.name = nm; prof.contact = ct; LS.set('rb_prof', prof); btn.disabled = true;
  const p = { action: 'submit', token: run.token, did, name: nm, contact: ct, score: run.score, tEnd: run.tEnd, ev: run.ev, mode: run.mode, v: CONFIG.VERSION };
  try {
    let r;
    if (isOffline()) r = { ok: false, err: 'net' };
    else { msg.textContent = 'Submitting…'; r = await trySubmit(p, 20000, sec => { msg.textContent = 'The server is busy, still trying… ' + sec + 's'; }); }
    if (r.ok) { run.done = 1; saveTicket(r, p); ticketScreen(r); return; }
    if (['net', 'busy', 'server', 'rate'].indexOf(r.err) >= 0) {
      enqueue(p);                                                                // saved on the device, uploads automatically later
      msg.innerHTML = '<span class="okc">💾 Saved on this device.</span> It uploads automatically when the connection is back (you can find it in Profile). You don’t need to do anything.';
      $('after').style.display = 'block'; btn.style.display = 'none'; return;
    }
    msg.innerHTML = `<span class="warn">${esc(ERR[r.err] || 'Could not submit (' + r.err + ').')}</span>`; btn.disabled = false;
    if (r.err !== 'name') { $('after').style.display = 'block'; btn.style.display = 'none'; }
  } finally { submitting = false; }
}
function ticketScreen(r) {
  screen(`<h1>Score verified ✅</h1><div class="ticket"><div class="meta">Verification code</div><div class="code" id="code">${esc(r.code)}</div>
  <div class="meta">${run.score} pts · ${MODE_NAME[run.mode]}${r.rank ? ' · about #' + r.rank : ''}</div></div>
  <p class="meta">Take a screenshot. If you finish in the prize ranks, show this code to Rainbrew staff. The leaderboard updates within a minute.</p>
  <button data-a="copy">Copy code</button><div class="row"><button data-a="again">Play again 🦄</button><button class="sec" data-a="lb">🏆 Board</button></div><div class="row"><button class="sec" data-a="share">📣 Share</button><button class="sec" data-a="menu">Menu</button></div>`);
}
function saveLocal() {
  const nm = $('nm').value.trim() || 'Unicorn'; prof.name = nm; LS.set('rb_prof', prof);
  const lb = localBoard(run.mode); lb.push({ n: nm, s: run.score }); lb.sort((a, b) => b.s - a.s); LS.set('rb_local_' + run.mode, lb.slice(0, 10)); lbTab = run.mode; lbScreen();
}

/* ============ actions & input ============ */
async function shareScore(b) {
  const r = run || { score: S0.score, mode }, url = String(location.href).split('#')[0].split('?')[0];
  const text = 'I scored ' + r.score + ' in ' + MODE_NAME[r.mode] + ' on Rainbrew Magic Catch! Can you beat me? 🦄';
  try { if (navigator.share) { await navigator.share({ title: 'Rainbrew Magic Catch', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); if (b) b.textContent = 'Copied ✓'; } catch (e) { if (b) b.textContent = 'Share not available'; }
}
const ACT = {
  play() { startGame(mode); }, again() { startGame(run ? run.mode : mode); }, menu, how, prof: profile, set() { backFn = st === 'pause' ? pauseScreen : menu; settings(); }, back() { (backFn || menu)(); backFn = null; },
  lb() { lbScreen(MODES[mode] && MODES[mode].ranked ? mode : 'rank'); }, lbr() { lbScreen(null, true); }, more: moreLb, submit: submitScore, local: saveLocal,
  resume() { ov.style.display = 'none'; st = 'ready'; cd = 3; cdN = 0; },
  refresh() { MODE_ORDER.forEach(m => refill(m, true)); say('Refreshing sessions…', 1); },
  endrun: endConfirm, pausebk: pauseScreen, endyes() { ov.style.display = 'none'; st = 'play'; endRun('quit'); },
  quit() { st = 'menu'; menu(); },
  share: shareScore, install: installApp,
  copy(b) { const c = $('code').textContent; try { navigator.clipboard.writeText(c); b.textContent = 'Copied ✓'; } catch (e) { b.textContent = c; } }
};
box.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; auInit(); sfx('click');
  const [a, x, y] = b.dataset.a.split(':');
  if (a === 'mode') { mode = x; LS.set('rb_mode', mode); menu(); }
  else if (a === 'tab') lbScreen(x);
  else if (a === 'skin') { cfg.skin = x; saveCfg(); profile(); }
  else if (a === 'cfg') { cfg[x] = y; saveCfg(); if (x === 'quality') resize(); settings(); }
  else if (ACT[a]) ACT[a](b);
});
box.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k) { const k = el.dataset.k; cfg[k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : +el.value; saveCfg(); if (k === 'sfx') sfx('catch', 2); if (k === 'mute' && !cfg.mute) sfx('click'); }
  else if (el.dataset.p) { prof[el.dataset.p] = el.value; LS.set('rb_prof', prof); }
});
function pauseGame() { if (st === 'play') pauseScreen(); }
cv.addEventListener('pointermove', e => { tx = e.clientX; });
cv.addEventListener('pointerdown', e => {
  auInit(); tx = e.clientX;
  if (st === 'count' && cd <= 0 && !sessDone && waitT > 4) { sessDone = true; noteUnranked = 'skipped'; }   // waiting too long for a session: tap to play a practice run
  if (st === 'play' && Math.hypot(e.clientX - (OX + PW - S * .6), e.clientY - (S * 1.35)) < S * .45) pauseGame();
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = String(e.key).toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.l = 1; if (k === 'arrowright' || k === 'd') keys.r = 1;
  if (k === 'p' || k === 'escape') { if (st === 'play') pauseGame(); else if (st === 'pause') ACT.resume(); }
  if (k === 'm') { cfg.mute = cfg.mute ? 0 : 1; saveCfg(); say(cfg.mute ? '🔇 Muted' : '🔊 Sound on', .9); }
  if ((k === 'enter' || k === ' ') && st === 'menu' && ov.style.display !== 'none' && e.target.tagName !== 'BUTTON') { e.preventDefault(); startGame(mode); }
});
addEventListener('keyup', e => { const k = String(e.key).toLowerCase(); if (k === 'arrowleft' || k === 'a') keys.l = 0; if (k === 'arrowright' || k === 'd') keys.r = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else { flushPending(); refill(mode); } });
addEventListener('blur', pauseGame);
addEventListener('online', () => { flushPending(true); refill(mode); if (curScr === 'menu' && st === 'menu') menu(); });
addEventListener('offline', () => { if (curScr === 'menu' && st === 'menu') menu(); });
addEventListener('resize', resize);

const raf = f => typeof requestAnimationFrame === 'function' ? requestAnimationFrame(f) : setTimeout(() => f(performance.now()), 16);
function loop(n) {
  const dt = Math.min(.05, Math.max(0, (n - last) / 1000) || 0); last = n; if (dt > 0) fpsA += (1 / dt - fpsA) * .05;
  try { update(dt); draw(); } catch (e) { if (errs++ < 5 && typeof console !== 'undefined') console.error(e); }   // one bad frame must never freeze the game
  raf(loop);
}
resize(); px = tx = W / 2; if (!LS.get('rb_seen', 0)) { LS.set('rb_seen', 1); how(); } else menu(); refillSoon(mode); setTimeout(flushPending, 1500 + Math.random() * 2000);
setInterval(() => { if (!document.hidden) { flushPending(); refill(mode); } }, 12000 + Math.random() * 6000);
try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}   // lets the game open with no connection
raf(loop);
</script></body></html>
