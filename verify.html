<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rainbrew Magic Catch | Staff</title>
<!-- Staff-only page. Open it once with the staff link (or paste the staff code) and this device stays connected. -->
<style>
:root{--ink:#3d2566;--bg:#f6f1ff;--card:#fff;--line:#e2d6fb;--btn:#7b4bb8;--btn2:#ff8fcf;--ok:#1f8a57;--warn:#b45309;--bad:#b42318;--soft:#efe6ff}
@media (prefers-color-scheme:dark){:root{--ink:#f3e8ff;--bg:#1d1433;--card:#2a1d49;--line:#46336f;--btn:#a78bfa;--btn2:#e56bb8;--ok:#6ee7a8;--warn:#fdba74;--bad:#fca5a5;--soft:#35255c}}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px;padding-bottom:60px;font-size:16px}
main{max-width:720px;margin:0 auto}h1{font-size:1.35rem;margin:0}h2{font-size:1rem;margin:0 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.meta{font-size:.82rem;opacity:.8}.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.ok{color:var(--ok);border-color:var(--ok)}.warnc{color:var(--warn);border-color:var(--warn)}.badc{color:var(--bad);border-color:var(--bad)}.gift{color:var(--btn);border-color:var(--btn)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tab{flex:1 0 auto;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--btn2),var(--btn));color:#fff;border-color:transparent}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--btn2),var(--btn));text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}button.red{background:var(--bad)}button:disabled,.btn.dis{opacity:.5;pointer-events:none}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.card.prize{border-color:var(--btn2);box-shadow:0 0 0 3px var(--soft)}
.head{display:flex;align-items:center;gap:10px}.rank{font-size:1.5rem;min-width:2.2rem;text-align:center}.who{flex:1;min-width:0}.who b{display:block;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:1.4rem;font-weight:800}.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.05em}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts>*{flex:1 1 140px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.row .who b{font-size:1rem}
.toast{position:sticky;top:6px;z-index:5;background:var(--ok);color:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700}.toast.bad{background:var(--bad)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}.foot .acts>*{flex:1 1 120px}
.center{text-align:center}.pad{padding:24px 6px}
</style></head><body><main id="app"></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const MODES = [['rank', '🏆 Rank'], ['classic', 'Classic'], ['rush', 'Rush'], ['infinite', 'Infinite']];
const ERRS = { auth: 'This staff code is wrong or was changed. Ask the game owner for a new one.', locked: 'Too many wrong attempts. Wait 10 minutes.', notfound: 'No score found with that code.', busy: 'The server is busy. Try again in a moment.' };
const app = $('app');

let conn = LS.get('rb_staff', null);
const S = { mode: 'rank', rows: [], players: 0, season: '', auto: true, q: '', found: null, open: {}, prizes: +LS.get('rb_staff_prizes', 3) || 3, who: LS.get('rb_staff_who', ''), toast: '', bad: false, busy: false, updated: 0, loaded: false, error: '', comp: null, showComp: false, form: {} };

/* ---------- connect (one time) ---------- */
function decode(str) {
  str = String(str || '').trim();
  const m = /[#?&]s=([\w\-=]+)/.exec(str); if (m) str = m[1];
  try {
    let b = str.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    const j = JSON.parse(atob(b));
    if (j && /^https:\/\/script\.google(usercontent)?\.com\//.test(j.u) && j.k) return { u: String(j.u).replace(/\/dev(\?.*)?$/, '/exec'), k: j.k };   // /dev is the owner-only test address
  } catch (e) {}
  return null;
}
function connect(str) {
  const c = decode(str);
  if (!c) { S.error = 'That doesn’t look like a staff code. Paste the whole code or link.'; render(); return false; }
  conn = c; LS.set('rb_staff', c); S.error = ''; load(); return true;
}
function disconnect() { conn = null; LS.set('rb_staff', null); S.rows = []; S.loaded = false; render(); }

/* ---------- server ---------- */
const HELP = 'Can’t reach the server. Ask the game owner to check in Apps Script: Deploy → Manage deployments → Edit → “Who has access” must be Anyone, the address must end in /exec, then Version: New version → Deploy.';
async function call(body) {
  let r; try { r = await fetch(conn.u, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: conn.k }, body)) }); } catch (e) { const x = new Error(HELP); x.code = 'net'; throw x; }
  let j; try { j = await r.json(); } catch (e) { const x = new Error('The server answered with a web page instead of data. In Apps Script set “Who has access” to Anyone and redeploy a New version.'); x.code = 'html'; throw x; }
  if (!j.ok) { const e = new Error(ERRS[j.err] || ('Error: ' + j.err)); e.code = j.err; throw e; }
  return j;
}
function flash(msg, bad) { S.toast = msg; S.bad = !!bad; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.toast = ''; render(); }, 3500); }
async function load(silent) {
  if (!conn || S.busy) return; S.busy = true; if (!silent) render();
  try {
    try { S.comp = (await call({ action: 'a_comp' })).comp; } catch (e) { if (e.code === 'auth') throw e; }
    if (S.mode === 'contest' && !S.comp) S.mode = 'rank';
    const j = await call(S.mode === 'contest' ? { action: 'a_top', mode: 'rank', season: S.comp.season, limit: 100 } : { action: 'a_top', mode: S.mode, limit: 100 });
    S.rows = j.rows; S.players = j.players; S.season = j.season; S.auto = j.auto; S.updated = Date.now(); S.loaded = true; S.error = '';
  } catch (e) { S.error = e.message; if (e.code === 'auth') { conn = null; LS.set('rb_staff', null); } }
  S.busy = false; render();
}

/* ---------- actions ---------- */
const norm = c => String(c || '').toUpperCase().replace(/\s/g, '');
function patchRow(row) {
  const i = S.rows.findIndex(r => r.code === row.code); if (i >= 0) S.rows[i] = row;
  if (S.found && S.found.code === row.code) S.found = row;
}
function msgFor(r, rank) {
  return 'Hi ' + r.name + '! 🎉 Congrats from Rainbrew Coffee Shop. You’re ' + (rank ? '#' + rank + ' ' : '') + 'in Magic Catch (' + r.mode + ') with ' + r.score + ' pts. Please show your code ' + r.code + ' at the counter to claim your prize.';
}
async function act(a, code, extra) {
  try {
    if (a === 'mode') { S.mode = code; S.found = null; S.q = ''; S.rows = []; S.loaded = false; S.busy = false; return load(); }
    if (a === 'refresh') return load();
    if (a === 'toggle') { S.open[code] = !S.open[code]; return render(); }
    if (a === 'prizes') { S.prizes = Math.max(1, Math.min(20, S.prizes + (+code))); LS.set('rb_staff_prizes', S.prizes); return render(); }
    if (a === 'disconnect') return disconnect();
    if (a === 'csv') return download();
    if (a === 'copy') { try { await navigator.clipboard.writeText(extra || ''); flash('Message copied'); } catch (e) { flash('Copy not available on this device', true); } return; }
    if (a === 'give' || a === 'void' || a === 'undo') {
      const r = (S.rows.find(x => x.code === code) || S.found);
      if (a === 'give') {
        if (r && r.risk === 'REVIEW' && !confirm('⚠️ This score was flagged for review (unusually perfect). Check it with the owner before handing over a prize. Give the prize anyway?')) return;
        if (!confirm('Hand over the prize to ' + (r ? r.name : 'this player') + '?')) return;
        if (!S.who) { S.who = (prompt('Your name, for the prize record') || 'staff').slice(0, 12); LS.set('rb_staff_who', S.who); }
      }
      if (a === 'void' && !confirm('Remove this score from the leaderboard?')) return;
      const j = await call({ action: 'a_mark', code, status: a === 'give' ? 'CLAIMED' : a === 'void' ? 'VOID' : 'OK', by: S.who || 'staff' });
      patchRow(j.row); if (a === 'void') { S.rows = S.rows.filter(x => x.code !== code); S.found = null; }
      flash(a === 'give' ? '🎁 Prize recorded for ' + j.row.name : a === 'void' ? 'Score removed' : 'Restored'); return;
    }
    if (a === 'comp') { S.showComp = !S.showComp; return render(); }
    if (a === 'compsave') {
      const f = S.form, name = f.cn != null ? f.cn : 'Rainbrew Contest', start = new Date(f.cs != null ? f.cs : localInput(nextHour())).getTime(), dur = +(f.cd != null ? f.cd : 7), unit = (f.cu || 'days') === 'hours' ? 3600e3 : 86400e3;
      if (!start || !(dur > 0)) return flash('Check the start date and how long it lasts', true);
      const j = await call({ action: 'a_comp_set', name, start, end: start + dur * unit, grace: +(f.cg != null ? f.cg : 15) });
      S.comp = j.comp; flash('Competition saved: ' + j.comp.name); return load();
    }
    if (a === 'diag') { const j = await call({ action: 'a_diag' }); S.diag = j; return render(); }
    if (a === 'diagclose') { S.diag = null; return render(); }
    if (a === 'repair') { const j = await call({ action: 'a_repair' }); flash('Repaired ' + j.fixed + ' cells'); return act('diag'); }
    if (a === 'compclear') { if (!confirm('Remove the competition? Its scores stay in the sheet.')) return; const j = await call({ action: 'a_comp_clear' }); S.comp = j.comp; if (S.mode === 'contest') S.mode = 'rank'; flash('Competition removed'); return load(); }
    if (a === 'season') {
      const n = prompt('Name for a new leaderboard (the current one stays saved in the sheet):', '');
      if (n === null || !n.trim()) return;
      const j = await call({ action: 'a_season', season: n }); flash('New board started: ' + j.season); return load();
    }
    if (a === 'autoseason') { if (!confirm('Go back to automatic seasons?')) return; const j = await call({ action: 'a_season', season: '' }); flash('Automatic seasons on: ' + j.season); return load(); }
  } catch (e) { flash(e.message, true); }
}
let lookupT = 0;
function onSearch(v) {
  S.q = v; S.found = null; render();
  clearTimeout(lookupT);
  const c = norm(v);
  if (/^(RB-?)?[0-9A-F]{4}-?[0-9A-F]{4}$/.test(c) && !visible().length) {                      // a full code that isn't in the list: ask the server
    const full = c.replace(/^RB-?/, '').replace('-', ''), code = 'RB-' + full.slice(0, 4) + '-' + full.slice(4, 8);
    lookupT = setTimeout(async () => { try { const j = await call({ action: 'a_lookup', code }); S.found = j.row; S.error = ''; } catch (e) { S.error = e.message; } render(); }, 250);
  }
}
function download() {
  const head = ['Rank', 'Name', 'Mobile', 'Score', 'Code', 'Check', 'Status', 'When'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [head.join(',')].concat(S.rows.map((r, i) => [i + 1, r.name, r.contact, r.score, r.code, r.risk, r.status, r.when].map(q).join(','))).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'winners-' + S.mode + '-' + S.season + '.csv'; a.click(); } catch (e) { flash('Download not available here', true); }
  return csv;
}

/* ---------- competition panel ---------- */
const nextHour = () => Math.ceil(Date.now() / 3600e3) * 3600e3;
function localInput(ms) { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const when = ms => { try { return new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
function compPanel() {
  const c = S.comp, f = S.form, val = (k, d) => esc(f[k] != null ? f[k] : d);
  const status = !c ? 'No competition is set.' : { upcoming: 'Starts ' + when(c.start) + '.', live: 'LIVE until ' + when(c.end) + '.', closing: 'Ended. Late uploads are accepted until ' + when(c.end + c.grace * 60000) + '.', ended: 'Ended ' + when(c.end) + '. The winners are shown to everyone in the game.' }[c.state];
  return `<div class="card"><h2>🏁 Competition</h2><p class="meta">Rank scores played between the start and the end decide the winners. Players see the countdown in the game and, after the deadline, who won.</p>
  <p>${c ? '<b>' + esc(c.name) + '</b><br>' : ''}${esc(status)}</p>
  <label for="cn">Name</label><input id="cn" maxlength="30" value="${val('cn', 'Rainbrew Contest')}">
  <label for="cs">Starts</label><input id="cs" type="datetime-local" value="${val('cs', localInput(nextHour()))}">
  <div class="acts"><div><label for="cd">Lasts</label><input id="cd" type="number" min="1" max="90" value="${val('cd', '7')}"></div><div><label for="cu">&nbsp;</label><select id="cu"><option value="days"${(f.cu || 'days') === 'days' ? ' selected' : ''}>days</option><option value="hours"${f.cu === 'hours' ? ' selected' : ''}>hours</option></select></div></div>
  <label for="cg">Late uploads still count for (minutes)</label><input id="cg" type="number" min="0" max="240" value="${val('cg', '15')}">
  <div class="acts"><button data-act="compsave">Save competition</button>${c ? '<button class="alt" data-act="compclear">Remove it</button>' : ''}</div></div>`;
}
/* ---------- screens ---------- */
function visible() {
  const q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  const all = S.rows.map((r, i) => ({ r, rank: i + 1 }));
  if (!q) return all;
  return all.filter(({ r }) => String(r.name).toLowerCase().includes(q) || String(r.code).toLowerCase().includes(q.replace(/\s/g, '')) || (qd.length >= 3 && String(r.contact).includes(qd)));
}
function chips(r) {
  return (r.status === 'CLAIMED' ? '<span class="chip gift">🎁 Prize given</span> ' : '') + (r.risk === 'REVIEW' ? '<span class="chip warnc">⚠️ Check first</span>' : '<span class="chip ok">✅ Verified</span>');
}
function why(r) { const n = String(r.note || ''), out = []; if (/uniform-timing/.test(n)) out.push('catch timing was suspiciously uniform'); if (/fast-moves/.test(n)) out.push('it moved faster than a finger can'); return out.length ? out.join(' and ') : 'it was close to a perfect game'; }
function details(r, rank) {
  const claimed = r.status === 'CLAIMED', sms = r.contact ? 'sms:' + r.contact + '?&body=' + encodeURIComponent(msgFor(r, rank)) : '';
  return `<div class="meta" style="margin-top:8px">Code <span class="code">${esc(r.code)}</span> · Mobile <b>${esc(r.contact) || 'not given'}</b> · ${esc(r.when)}${/bosses:/.test(r.note || '') ? ' · ' + esc(String(r.note).replace(/flags:\S+/, '').trim()) : ''}${claimed ? ' · given ' + esc(r.claimedAt) + ' by ' + esc(r.claimedBy) : ''}</div>
  ${r.risk === 'REVIEW' ? '<div class="meta warnc" style="margin-top:6px">Look at this run before handing over a prize: ' + esc(why(r)) + '.</div>' : ''}
  <div class="acts"><button data-act="give" data-code="${esc(r.code)}" ${claimed ? 'disabled' : ''}>🎁 ${claimed ? 'Prize given' : 'Give prize'}</button>
  ${sms ? `<a class="btn alt" href="${esc(sms)}">💬 Text winner</a>` : '<span class="btn alt dis">💬 No number</span>'}
  <button class="alt" data-act="copy" data-code="x" data-extra="${esc(msgFor(r, rank))}">Copy message</button>
  ${claimed ? `<button class="alt" data-act="undo" data-code="${esc(r.code)}">Undo</button>` : ''}<button class="alt" data-act="void" data-code="${esc(r.code)}">Remove score</button></div>`;
}
function card(r, rank, prize, open) {
  return `<div class="card${prize ? ' prize' : ''}"><div class="head" ${prize ? '' : `data-act="toggle" data-code="${esc(r.code)}"`}><div class="rank">${['🥇', '🥈', '🥉'][rank - 1] || (rank ? rank + '.' : '🔎')}</div>
  <div class="who"><b>${esc(r.name)}</b>${chips(r)}${prize && rank ? ` <span class="chip">Prize #${rank}</span>` : ''}</div><div class="score">${esc(r.score)}</div></div>${prize || open ? details(r, rank) : ''}</div>`;
}
const REFUSED = { version: 'the game and the server are on different versions (update both: Code.gs and every file of the game)', contact: 'Rank needs a Philippine mobile number and the player did not give a valid one', closed: 'the competition had already ended', mismatch: 'the score did not match the server\u2019s replay (an out-of-date game, or tampering)', token: 'the session was not valid', expired: 'the session was older than 7 days', device: 'the session belonged to another phone', rate: 'too many tries from one phone', server: 'the server could not save the row (see the problems below)', size: 'the upload was too large', time: 'the run failed the time check', clock: 'the run failed the time check', timing: 'the run failed the replay check', kind: 'the run failed the replay check', order: 'the run failed the replay check', item: 'the run failed the replay check', format: 'the run failed the replay check', afterover: 'the run failed the replay check', events: 'the run was too long to check', name: 'no name was given', used: 'the same session was sent twice', busy: 'the server was busy', mode: 'unknown mode', unknown: 'unknown reason' };
function ago2(t) { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? 'just now' : m < 90 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; }
function diagCard() {
  const d = S.diag, MN = { rank: 'Rank', classic: 'Classic', rush: 'Rush', infinite: 'Infinite' }, L = [];
  const where = `<a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">${esc(d.spreadsheet)}</a> → tab “${esc(d.sheetName)}”`;
  if (!d.rows) L.push('⚠️ <b>No scores have reached this Sheet yet.</b> Players’ scores are not arriving. Check: (1) the game’s <code>API_URL</code> is the Web app address ending in <code>/exec</code>; (2) in the game, Settings → Check the server says the game and server match; (3) Deploy → Manage deployments → Who has access = Anyone; (4) you are looking at the Sheet named above (the one where <code>setup</code> was run).');
  if (d.write) L.push(d.write.ok ? `✅ The script can write to the Sheet${d.runsAs ? ' (it runs as ' + esc(d.runsAs) + ')' : ''}.` : `⚠️ <b>The script cannot write to the Sheet</b>: ${esc(d.write.msg)}. This is the usual reason plays are not recorded. In Apps Script open <b>Deploy → Manage deployments → Edit</b>: <b>Execute as</b> must be <b>Me</b> (not “User accessing the web app”) and <b>Who has access</b> must be <b>Anyone</b>; choose <b>Version: New version → Deploy</b>. Also make sure the Sheet is not protected.`);
  if (d.submits) {
    const ref = Object.keys(d.submits.refused || {}), since = d.submits.since ? ' (since ' + ago2(d.submits.since) + ')' : '';
    if (!d.submits.ok && !ref.length) L.push('⚠️ <b>No score upload has reached the server recently.</b> Either nobody finished a ranked game, or the phones are not sending: check the game’s <code>API_URL</code> and Settings → Check the server. (Players must also have entered their name; v6.2 records automatically once a name is saved.)');
    else L.push(`📥 Recent uploads${since}: <b>${d.submits.ok}</b> accepted${ref.length ? '; <b>refused</b>: ' + ref.map(k => `${d.submits.refused[k]}× ${esc(REFUSED[k] || k)}`).join('; ') : ''}.`);
  }
  if (d.fails && d.fails.length) L.push('Recent problems: ' + d.fails.slice(-5).map(f => `${ago2(f.t)} · ${esc(f.w)}${f.x ? ' (' + esc(f.x) + ')' : ''}: ${esc(f.m)}`).join(' | '));
  Object.keys(d.boards).forEach(m => {
    const others = d.groups.filter(g => g.mode === m && g.season !== String(d.seasons[m]) && g.status !== 'VOID' && g.status !== 'TEST');
    if (d.boards[m] > 0) L.push(`✅ <b>${MN[m]}</b>: the board shows season “${esc(d.seasons[m])}” with <b>${d.boards[m]}</b> player${d.boards[m] === 1 ? '' : 's'}.`);
    else if (others.length) L.push(`⚠️ <b>${MN[m]}</b> is empty because the board shows season “${esc(d.seasons[m])}”, but the Sheet holds ${others.map(o => o.n + ' score' + (o.n === 1 ? '' : 's') + ' under “' + esc(o.season) + '”').join(', ')}. A new season or competition starts a fresh board; the older scores are safe in the Sheet.`);
    else L.push(`ℹ️ <b>${MN[m]}</b>: no scores yet this season (“${esc(d.seasons[m])}”).`);
  });
  if (d.oddSeasons) L.push(`⚠️ <b>${d.oddSeasons} rows have a season that Google Sheets turned into a date or number</b> (for example a season named “10-15” or “2026-10”). The game now reads these correctly, but you can fix the cells for good: <button class="alt" data-act="repair">Repair now</button>`);
  if (d.hidden.TEST || d.hidden.VOID) L.push(`ℹ️ Hidden on purpose: ${d.hidden.TEST} test row${d.hidden.TEST === 1 ? '' : 's'} (load test) and ${d.hidden.VOID} removed by staff.`);
  if (d.compState !== 'none') L.push(`🏁 Competition “${esc(d.compName)}” is <b>${esc(d.compState)}</b>. ${d.compState === 'upcoming' ? 'Rank shows the normal weekly board until it starts.' : 'Rank shows its own board, and keeps showing the final standings after the deadline until you remove the competition.'}`);
  if (d.recent.length) L.push('Newest scores in the Sheet: ' + d.recent.map(r => `${esc(r.name)} (${esc(MN[r.mode] || r.mode)}, ${esc(r.score)}, “${esc(r.season)}”${r.status && r.status !== 'OK' ? ', ' + esc(r.status) : ''})`).join('; '));
  return `<div class="card"><h2>Leaderboard check</h2><p class="meta">Scores are stored in ${where} (${d.rows} rows). Server rules version ${esc(d.rules)}.</p>${L.map(x => `<p style="margin:8px 0">${x}</p>`).join('')}<div class="acts"><button class="alt" data-act="diag">Check again</button><button class="alt" data-act="diagclose">Close</button></div></div>`;
}
function connectScreen() {
  return `<div class="pad center"><h1>Rainbrew staff 🦄</h1><p class="meta">Connect this device once. Open the staff link the owner gave you, or paste the staff code below.</p>
  <input id="code" placeholder="Paste staff code or link" autocomplete="off"><p class="meta" style="color:var(--bad)">${esc(S.error)}</p><button data-act="connect">Connect</button></div>`;
}
function main() {
  const vis = visible(), q = S.q.trim();
  const prizeRows = q ? [] : vis.filter(v => v.rank <= S.prizes), rest = q ? vis : vis.filter(v => v.rank > S.prizes);
  return `<div class="top"><div><h1>Magic Catch staff</h1><div class="meta">${S.season ? esc(S.season) + (S.mode === 'contest' ? ' · contest results' : S.auto ? ' · automatic board' : ' · set by hand') + ' · ' : ''}${S.players} players${S.updated ? ' · updated ' + Math.max(0, Math.round((Date.now() - S.updated) / 1000)) + 's ago' : ''}</div></div><div class="acts" style="margin:0"><button class="alt" data-act="comp">🏁 Contest</button><button class="alt" data-act="refresh">${S.busy ? '…' : '⟳'}</button></div></div>
  ${S.diag ? diagCard() : ''}
  ${S.toast ? `<div class="toast${S.bad ? ' bad' : ''}">${esc(S.toast)}</div>` : ''}${S.error ? `<div class="toast bad">${esc(S.error)}</div>` : ''}
  ${S.showComp ? compPanel() : ''}
  <div class="tabs">${MODES.concat(S.comp ? [['contest', '🏁 Results']] : []).map(([m, n]) => `<button class="tab${S.mode === m ? ' on' : ''}" data-act="mode" data-code="${m}">${n}</button>`).join('')}</div>
  <input id="q" placeholder="Search a code, name or phone number" value="${esc(S.q)}" autocomplete="off" inputmode="search">
  ${S.found ? `<h2 style="margin-top:12px">Found by code</h2>${card(S.found, 0, true)}` : ''}
  ${prizeRows.length ? `<h2 style="margin-top:12px">Prize winners (top ${S.prizes})</h2>` + prizeRows.map(v => card(v.r, v.rank, true)).join('') : ''}
  ${rest.length ? `<h2 style="margin-top:12px">${q ? 'Matches' : 'Everyone else'}</h2><div class="card">${rest.map(v => `<div class="row" data-act="toggle" data-code="${esc(v.r.code)}"><div class="rank">${v.rank}.</div><div class="who"><b>${esc(v.r.name)}</b>${chips(v.r)}</div><div class="score">${esc(v.r.score)}</div></div>${S.open[v.r.code] ? details(v.r, v.rank) : ''}`).join('')}</div>` : ''}
  ${!vis.length && !S.found && S.loaded ? `<div class="card center">${q ? 'No match. If you have a full code, type it in full.' : 'No scores yet this season.'}</div>` : ''}
  <div class="foot"><div class="acts"><button class="alt" data-act="prizes" data-code="-1">− prize</button><span class="meta center" style="align-self:center">Prizes for the top <b>${S.prizes}</b></span><button class="alt" data-act="prizes" data-code="1">+ prize</button></div>
  <div class="acts"><button class="alt" data-act="diag">🔍 Why is a board empty?</button><button class="alt" data-act="csv">⬇ Winners list (CSV)</button><button class="alt" data-act="season">Start a new board</button>${S.auto ? '' : '<button class="alt" data-act="autoseason">Back to automatic</button>'}<button class="alt" data-act="disconnect">Disconnect this device</button></div></div>`;
}
function render() {
  const el = typeof document !== 'undefined' ? document.activeElement : null, keep = !!(el && el.id === 'q'), pos = keep ? el.selectionStart : 0;
  app.innerHTML = conn ? main() : connectScreen();
  if (keep && $('q')) { $('q').focus(); try { $('q').setSelectionRange(pos, pos); } catch (e) {} }
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'connect') { connect($('code').value); return; }
  act(a, b.dataset.code, b.dataset.extra);
});
app.addEventListener('input', e => { if (e.target.id === 'q') onSearch(e.target.value); else if (/^c[nsdug]$/.test(e.target.id)) S.form[e.target.id] = e.target.value; });
app.addEventListener('change', e => { if (e.target.id === 'cu') S.form.cu = e.target.value; });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') connect(e.target.value); });

/* ---------- start ---------- */
(function init() {
  const h = location.hash || '';
  if (/[#&]s=/.test(h)) { const c = decode(h); if (c) { conn = c; LS.set('rb_staff', c); } try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }   // the code never stays in the address bar
  render();
  if (conn) load();
  setInterval(() => { if (conn && !document.hidden && !S.busy) load(true); }, 30000);
})();
window.__v = { S, act, load, decode, download, render, onSearch, visible };
</script></body></html>
